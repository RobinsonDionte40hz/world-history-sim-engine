[package]
name = "consciousness-engine"
version = "0.1.0"
edition = "2024"
description = "High-performance NPC consciousness engine for WebAssembly"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RobinsonDionte40hz/world-history-sim-engine"
homepage = "https://github.com/RobinsonDionte40hz/world-history-sim-engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "console",
  "Performance",
  "Window",
] }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = "1.0"
console_error_panic_hook = { workspace = true }
wee_alloc = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
wasm-logger = "0.2"
rand = { version = "0.8", features = ["getrandom"] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
criterion = { workspace = true }
quickcheck = { workspace = true }

[[bench]]
name = "behavioral_state_bench"
harness = false

[[bench]]
name = "serialization_bench"
harness = false

[profile.release]
opt-level = 3              # Maximum optimization
lto = true                 # Enable link-time optimization
codegen-units = 1          # Better optimization, slower compile
panic = 'abort'            # Reduce binary size
strip = true               # Strip debug symbols

[profile.release-small]
inherits = "release"
opt-level = "z"            # Optimize for size
lto = "fat"                # Aggressive LTO

[profile.release-perf]
inherits = "release"
opt-level = 3              # Maximum speed
lto = "thin"               # Fast LTO

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd"]  # Maximum optimization with SIMD

[package.metadata.wasm-pack.profile.release-small]
wasm-opt = ["-Oz", "--enable-bulk-memory"]  # Optimize for size
